<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование – Music Only</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>

    <!-- Шапка и Навигация (копируем из records.html) -->
    <header class="bg-loft py-4 border-bottom border-dark border-2">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12 text-center text-md-start">
                    <h1 class="h3 mb-1 fw-bold text-white">Music Only</h1>
                    <p class="mb-0 text-loft-light">Пространство для прослушивания музыки на Hi-Fi оборудовании</p>
                </div>
            </div>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-loft border-bottom border-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-loft-accent" href="index.html">MO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white-50" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="records.html">Фонотека</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="events.html">Лекторий</a></li>
                    <li class="nav-item"><a class="nav-link active text-white fw-bold" href="booking.html">Бронирование</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Форма бронирования -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm bg-white p-4 p-md-5">
                    <h2 class="fw-bold text-dark mb-4 text-center">Забронировать визит</h2>
                    <p class="text-muted text-center mb-4">Выберите удобные дату, время и оборудование для прослушивания.</p>

                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Ваше имя</label>
                            <input type="text" class="form-control" id="name" placeholder="Иван Иванов" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-bold">Телефон</label>
                            <input type="tel" class="form-control" id="phone" placeholder="+7 (900) 000-00-00" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="date" class="form-label fw-bold">Дата</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="time" class="form-label fw-bold">Время</label>
                                <input type="time" class="form-control" id="time" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="equipment" class="form-label fw-bold">Оборудование</label>
                            <select class="form-select" id="equipment" required>
                                <option value="" selected disabled>Выберите оборудование...</option>
                                <option value="1">Акустическая система Focal Aria Evo X N4</option>
                                <option value="2">Студийные наушники Sony MDR-7506</option>
                                <option value="3">Свой винил (принесу с собой)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-loft-primary btn-lg w-100 fw-bold">Отправить заявку</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Подвал -->
    <footer class="bg-loft py-4 mt-5">
        <div class="container">
            <div class="row align-items-center g-3">
                <div class="col-12 col-md-6">
                    <p class="mb-0 text-loft-light">&copy; 2026 Music Only.</p>
                </div>
                <div class="col-12 col-md-6 text-md-end">
                    <a class="text-white-50 text-decoration-none me-3" href="records.html">Фонотека</a>
                    <a class="text-white-50 text-decoration-none" href="booking.html">Бронирование</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
